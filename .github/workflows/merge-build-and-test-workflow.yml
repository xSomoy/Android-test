# Builds the app and runs unit tests on push
name: Build and test

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    # Run this job only if the pull request is not a draft
    if: github.event.pull_request.draft == false
    name: Build app and execute unit tests on Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history so Spotless `ratchetFrom origin/main` can diff against the base branch.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Print project directory content
        run: |
          echo "Current directory is: ${GITHUB_WORKSPACE}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant permission to Gradle
        run: chmod +x ./gradlew

      - name: Check code formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        run: ./gradlew test

      - name: Archive test reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            ./**/build/reports/

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
